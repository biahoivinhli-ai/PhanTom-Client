name: Build PhanTom Client

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        run: |
          curl -s https://services.gradle.org/distributions/gradle-8.11-bin.zip -o gradle.zip
          unzip -q gradle.zip
          export PATH=$PWD/gradle-8.11/bin:$PATH
          cd PhanTom_Upgraded
          gradle wrapper
          chmod +x gradlew

      - name: Build
        run: |
          cd PhanTom_Upgraded
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PhanTom_Client
          path: PhanTom_Upgraded/build/libs/PhanTom_Client-1.0.0.jar
          retention-days: 7
